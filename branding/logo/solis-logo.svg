<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background subtle radial ambient -->
    <radialGradient id="solisAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E0D" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#FF6B00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F1016" stop-opacity="0"/>
    </radialGradient>

    <!-- Core Sun Gradient -->
    <linearGradient id="sunCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="45%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>

    <!-- Outer Aura Gradient -->
    <linearGradient id="outerAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF9800" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#E65100" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glassmorphic Ring Gradient -->
    <linearGradient id="glassRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFB74D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Fluent Shadow Filter -->
    <filter id="fluentShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6F00" flood-opacity="0.35"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="solarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#solisAmbient)"/>

  <!-- Outer Stylized Fluent Petals (Solstice Corona) -->
  <g filter="url(#fluentShadow)">
    <!-- 8 Rounded Rays / Petals -->
    <g transform="translate(256, 256)">
      <!-- Petal 1 (North) -->
      <path d="M -24,-130 C -36,-190 0,-215 0,-215 C 0,-215 36,-190 24,-130 Z" fill="url(#outerAura)"/>
      <!-- Petal 2 (North-East) -->
      <path d="M -24,-130 C -36,-190 0,-215 0,-215 C 0,-215 36,-190 24,-130 Z" fill="url(#outerAura)" transform="rotate(45)"/>
      <!-- Petal 3 (East) -->
      <path d="M -24,-130 C -36,-190 0,-215 0,-215 C 0,-215 36,-190 24,-130 Z" fill="url(#outerAura)" transform="rotate(90)"/>
      <!-- Petal 4 (South-East) -->
      <path d="M -24,-130 C -36,-190 0,-215 0,-215 C 0,-215 36,-190 24,-130 Z" fill="url(#outerAura)" transform="rotate(135)"/>
      <!-- Petal 5 (South) -->
      <path d="M -24,-130 C -36,-190 0,-215 0,-215 C 0,-215 36,-190 24,-130 Z" fill="url(#outerAura)" transform="rotate(180)"/>
      <!-- Petal 6 (South-West) -->
      <path d="M -24,-130 C -36,-190 0,-215 0,-215 C 0,-215 36,-190 24,-130 Z" fill="url(#outerAura)" transform="rotate(225)"/>
      <!-- Petal 7 (West) -->
      <path d="M -24,-130 C -36,-190 0,-215 0,-215 C 0,-215 36,-190 24,-130 Z" fill="url(#outerAura)" transform="rotate(270)"/>
      <!-- Petal 8 (North-West) -->
      <path d="M -24,-130 C -36,-190 0,-215 0,-215 C 0,-215 36,-190 24,-130 Z" fill="url(#outerAura)" transform="rotate(315)"/>
    </g>
  </g>

  <!-- Translucent Glassmorphic Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#glassRing)" stroke-width="6" opacity="0.85"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Core Glowing Sun Sphere -->
  <circle cx="256" cy="256" r="115" fill="url(#sunCore)" filter="url(#solarGlow)"/>

  <!-- Inner Solstice Crescent Arc (Geometric Modern Accent) -->
  <path d="M 210,170 C 270,170 318,218 318,278 C 318,310 304,338 282,358 C 310,340 330,305 330,265 C 330,195 275,140 205,140 C 180,140 156,148 136,162 C 158,167 183,170 210,170 Z"
        fill="#FFFFFF" opacity="0.32"/>

  <!-- Central Warm Highlight -->
  <ellipse cx="225" cy="220" rx="42" ry="26" transform="rotate(-30 225 220)" fill="#FFFFFF" opacity="0.45"/>
</svg>
