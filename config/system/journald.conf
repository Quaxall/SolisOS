# ─────────────────────────────────────────────
# Solis OS — Journal (Log) Yapılandırması
# /etc/systemd/journald.conf.d/solis.conf olarak kopyalanır
# ─────────────────────────────────────────────

[Journal]
# Maksimum journal boyutu (disk tasarrufu)
SystemMaxUse=100M

# Sıkıştırma etkinleştir
Compress=yes

# Depolama: kalıcı (persistent) veya volatile
Storage=persistent

# Eski logları otomatik temizle
MaxRetentionSec=7day
