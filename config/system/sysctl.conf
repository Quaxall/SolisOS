# ─────────────────────────────────────────────
# Solis OS — sysctl Performans Parametreleri
# /etc/sysctl.d/99-solis.conf olarak kopyalanır
# ─────────────────────────────────────────────

# ═══ Bellek Yönetimi ═══
# RAM dolmadan swap'a düşmeyi geciktir (0=asla swap, 100=agresif swap)
vm.swappiness = 10

# Dentry/inode cache tutma eğilimi (düşük = daha uzun cache)
vm.vfs_cache_pressure = 50

# Diske yazma eşiği (dirty page yüzdesi)
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Bellek overcommit stratejisi (0=akıllı, 1=her zaman izin ver)
vm.overcommit_memory = 0

# Minimum boş bellek (KB) — OOM killer'ı daha erken tetikle
vm.min_free_kbytes = 65536

# ═══ Ağ Performansı ═══
# Modern TCP congestion control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP bağlantı yeniden kullanımı
net.ipv4.tcp_tw_reuse = 1

# ═══ Dosya Sistemi ═══
# inotify izleme limiti (IDE'ler ve dosya yöneticileri için)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# ═══ Güvenlik ═══
# Magic SysRq tuşlarını etkinleştir (acil kurtarma için)
kernel.sysrq = 176

# dmesg erişimini kısıtla
kernel.dmesg_restrict = 1
