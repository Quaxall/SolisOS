# ─────────────────────────────────────────────
# Solis OS — ZRAM (Sıkıştırılmış Swap) Yapılandırması
# /etc/systemd/zram-generator.conf olarak kopyalanır
# ─────────────────────────────────────────────

[zram0]
# Sıkıştırma algoritması (zstd: en iyi oran/hız dengesi)
compression-algorithm = zstd

# ZRAM boyutu: RAM'in %50'si kadar
zram-size = ram / 2

# Swap önceliği (disk swap'tan önce)
swap-priority = 100

# Dosya sistemi türü (swap olarak kullan)
fs-type = swap
