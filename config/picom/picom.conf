# ─────────────────────────────────────────────────────
# Solis OS — picom Compositor Yapılandırması
# Windows 11 Fluent Design: Mica/Acrylic efektleri,
# yuvarlatılmış köşeler, modern gölgeler
# /etc/skel/.config/picom/picom.conf olarak kopyalanır
# ─────────────────────────────────────────────────────

# ═══════════════════════════════════════════
# Backend
# ═══════════════════════════════════════════
backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# ═══════════════════════════════════════════
# Yuvarlatılmış Köşeler (Rounded Corners)
# ═══════════════════════════════════════════
corner-radius = 12;

rounded-corners-exclude = [
    "window_type = 'desktop'",
    "class_g = 'xfce4-screenshooter'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'"
];

# ═══════════════════════════════════════════
# Gölgeler (Shadows)
# Windows 11 tarzı derin, yumuşak gölgeler
# ═══════════════════════════════════════════
shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.42;
shadow-color = "#000000";

shadow-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dnd'",
    "class_g = 'Conky'",
    "_GTK_FRAME_EXTENTS@:c",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# ═══════════════════════════════════════════
# Saydamlık / Opaklık (Opacity)
# ═══════════════════════════════════════════
inactive-opacity = 0.94;
active-opacity = 1.0;
frame-opacity = 0.92;

focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'slop'"
];

opacity-rule = [
    "92:class_g = 'Thunar' && focused",
    "85:class_g = 'Thunar' && !focused",
    "95:class_g = 'xfce4-terminal' && focused",
    "88:class_g = 'xfce4-terminal' && !focused"
];

# ═══════════════════════════════════════════
# Bulanıklaştırma (Blur — Acrylic / Mica Efekti)
# ═══════════════════════════════════════════
blur: {
    method = "dual_kawase";
    strength = 6;
    background = true;
    background-frame = false;
    background-fixed = false;
};

blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ═══════════════════════════════════════════
# Animasyonlar (Fading)
# Pencere açılış/kapanış geçişleri
# ═══════════════════════════════════════════
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 4;

fade-exclude = [
    "class_g = 'slop'"
];

# ═══════════════════════════════════════════
# Pencere Türü Ayarları
# ═══════════════════════════════════════════
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.92; focus = true; };
    dock = { shadow = true; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.94; shadow = true; };
    dropdown_menu = { opacity = 0.94; shadow = true; };
    utility = { shadow = true; };
    dialog = { shadow = true; };
    notification = { shadow = true; };
};
