# ─────────────────────────────────────────────
# Solis OS — Kernel Komut Satırı (GRUB)
# Bu parametreler GRUB_CMDLINE_LINUX_DEFAULT'a eklenir
# ─────────────────────────────────────────────

# Sessiz açılış + Plymouth splash
quiet splash

# I/O zamanlayıcı (SSD/NVMe optimize)
elevator=mq-deadline

# Spectre/Meltdown mitigasyonları (performans dengesi)
mitigations=auto

# systemd ile hızlı boot
systemd.show_status=auto
