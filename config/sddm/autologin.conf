# ═══════════════════════════════════════════════════════════════════
# ☀️ Solis OS — SDDM Wayland Otomatik Giriş Yapılandırması
# Doğrudan Wayland Canlı Masaüstü Oturumuna Başlatır
# ═══════════════════════════════════════════════════════════════════

[Autologin]
User=solis
Session=plasmawayland.desktop
Relogin=false

[Theme]
Current=breeze
CursorTheme=Fluent-dark

[Wayland]
EnableHiDPI=true
SessionCommand=/usr/share/sddm/scripts/wayland-session
